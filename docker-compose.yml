services:
  pg-limiter:
    image: ghcr.io/javadmoqaddam/pg-limiter:latest
    container_name: pg-limiter
    restart: always
    env_file: .env
    networks:
      - pg-limiter-network
    ports:
      - "8080:8080"  # API port (if enabled)
    volumes:
      # Persistent storage for database and logs
      - /var/lib/pg-limiter:/var/lib/pg-limiter
      # Config directory (read-only, for backup functionality)
      - /etc/opt/pg-limiter:/etc/opt/pg-limiter:ro
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONUNBUFFERED=1
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: "local"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  pg-limiter-network:
    driver: bridge
