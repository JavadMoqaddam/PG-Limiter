# Ruff configuration for PG-Limiter

# Target Python version - the oldest the CI matrix runs, so version-specific
# lint catches anything that would break on 3.12 rather than only on 3.13/3.14.
target-version = "py312"

# Line length
line-length = 120

# Exclude paths
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    "*.egg-info",
    "dist",
    "build",
    "db/migrations/versions/*.py",
]

[lint]
# Enable rules - starting with essential ones
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E402",   # Module level import not at top of file
    "E721",   # Type comparison
    "E722",   # Bare except
    "F401",   # Unused import (too many to fix now)
    "F541",   # f-string missing placeholders
    "F811",   # Redefinition of unused name
    "F841",   # Local variable assigned but never used
    "W291",   # Trailing whitespace
    "W292",   # No newline at end of file
    "W293",   # Blank line contains whitespace
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores
[lint.per-file-ignores]
# Tests were previously ignored wholesale ("ALL"), which hid undefined names and
# broken syntax in the suite itself. They now share the project's ignore list, so
# the release-blocker rules (E9/F63/F7/F82) run against tests too while style stays
# advisory.
"tests/*" = [
    "E501", "E402", "E721", "E722",
    "F401", "F541", "F811", "F841",
    "W291", "W292", "W293",
]
"db/migrations/*" = ["ALL"]
"__init__.py" = ["F401", "E501"]

[format]
# Use double quotes
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing commas
skip-magic-trailing-comma = false
# Unix line endings
line-ending = "auto"
