# Dependabot version updates.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Routine minor/patch upgrades are grouped into one PR per ecosystem so the queue
# stays reviewable; major bumps still open their own PR to be judged individually.

version: 2
updates:
  # Python runtime and development dependencies (requirements*.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-runtime-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "pytest*"
          - "bandit"
        update-types:
          - "minor"
          - "patch"
      python-development-minor-patch:
        patterns:
          - "ruff"
          - "pytest*"
          - "bandit"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI/release workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
