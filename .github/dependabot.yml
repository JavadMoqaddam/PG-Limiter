# Dependabot version updates.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Routine minor/patch upgrades are grouped into one PR per ecosystem so the queue
# stays reviewable; major bumps still open their own PR to be judged individually.

version: 2
updates:
  # Python runtime dependencies (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI/release workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"
