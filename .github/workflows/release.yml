name: Release PG-Limiter

on:
  push:
    branches: [main]
    paths: [limiter.py, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Serialize version checks and publication so a second branch run sees the tag
# created by the first and cannot rewrite an already published version.
concurrency:
  group: ${{ github.repository }}-stable-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.version.outputs.notes }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Validate committed version, tag and release notes
        id: version
        run: python3 tools/prepare_release.py --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --output "$GITHUB_OUTPUT"

  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, verify]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, image]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Create source archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p release
          git archive --format=tar HEAD | gzip -n > "release/pg-limiter-${RELEASE_VERSION}.tar.gz"
          git archive --format=zip --output="release/pg-limiter-${RELEASE_VERSION}.zip" HEAD

      # The reusable image workflow already pushed the exact version and latest
      # for this SHA. A tag created with GITHUB_TOKEN need not trigger another run.
      - name: Publish stable release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "PG-Limiter ${{ needs.version.outputs.version }}"
          body_path: ${{ needs.version.outputs.notes }}
          files: |
            release/pg-limiter-${{ needs.version.outputs.version }}.tar.gz
            release/pg-limiter-${{ needs.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
