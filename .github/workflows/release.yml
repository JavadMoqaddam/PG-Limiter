name: Release PG-Limiter

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version from tag or Python file
      id: get_version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        elif grep -q "VERSION\s*=" limiter.py; then
          VERSION=$(python3 -c "import re; content=open('limiter.py').read(); match=re.search(r'VERSION\s*=\s*[\"\'](.*?)[\"\']', content); print(match.group(1) if match else 'latest')")
        else
          VERSION="latest"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Create source archive
      run: |
        mkdir -p release
        # Create tar.gz archive (excluding git and unnecessary files)
        tar --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='*.bak' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='*.egg-info' \
            -czvf release/pg-limiter-${{ steps.get_version.outputs.version }}.tar.gz .
        
        # Create zip archive
        zip -r release/pg-limiter-${{ steps.get_version.outputs.version }}.zip . \
            -x ".git/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \
            -x "*.bak" \
            -x "data/*" \
            -x "logs/*" \
            -x "dist/*" \
            -x "build/*" \
            -x "*.egg-info/*"
    
    - name: Create/Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: "PG-Limiter ${{ steps.get_version.outputs.version }}"
        generate_release_notes: true
        body: |
          ## 🛡️ PG-Limiter ${{ steps.get_version.outputs.version }}

          High-performance IP connection limiter for PasarGuard Panel: real-time SSE
          log streaming or panel-API polling as the IP source, subnet grouping, High
          Trust mode, escalating punishment, Telegram forum topics, and SQLite under
          Alembic migrations as the single store.

          ### 🚀 Quick Install (Docker - Recommended)

          ```bash
          sudo bash <(curl -sSL https://raw.githubusercontent.com/JavadMoqaddam/PG-Limiter/main/pg-limiter.sh) install
          ```

          ### 🐳 Docker Image

          The Multi-Arch Docker image is available at:
          ```
          ghcr.io/javadmoqaddam/pg-limiter:latest
          ghcr.io/javadmoqaddam/pg-limiter:${{ steps.get_version.outputs.version }}
          ```
        files: |
          release/pg-limiter-${{ steps.get_version.outputs.version }}.tar.gz
          release/pg-limiter-${{ steps.get_version.outputs.version }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
