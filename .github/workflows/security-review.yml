name: "Security Review (Claude Code)"

# Anthropic's official AI security reviewer. It diffs the pull request, reasons
# about the change for injection/authz/secret-handling classes that pattern
# scanners miss, and posts findings as PR comments. It complements, rather than
# replaces, the existing CodeQL (codeql.yml) and Bandit (ci.yml) scans.
#
# Scoped to pull requests targeting the default branch, matching the convention
# in ci.yml and codeql.yml. The API key is read from a repository secret and is
# never hardcoded - see the setup note below.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write PR comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: Claude Code Security Review
    # Dependabot and fork PRs have no repository secrets. Their ordinary tests,
    # Bandit and CodeQL still run; the API-backed reviewer needs a trusted event.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Check out the PR head and enough history for the action to diff the
          # change against its base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Run Claude Code Security Review
        # No release tags are published; pin a commit so Dependabot can propose updates.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        env:
          # Route Claude API traffic through the self-hosted gateway. The
          # underlying Claude Code process reads this from the environment.
          ANTHROPIC_BASE_URL: "https://api.justwoker.icu"
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
