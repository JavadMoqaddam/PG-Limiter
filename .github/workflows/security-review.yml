name: "Security Review (Claude Code)"

# Anthropic's official AI security reviewer. It diffs the pull request, reasons
# about the change for injection/authz/secret-handling classes that pattern
# scanners miss, and posts findings as PR comments. It complements, rather than
# replaces, the existing CodeQL (codeql.yml) and Bandit (ci.yml) scans.
#
# Optional: enable the repository variable ENABLE_CLAUDE_SECURITY_REVIEW=true
# and configure ANTHROPIC_API_KEY. Ordinary tests and CodeQL do not need API credits.

on:
  pull_request:

# Least privilege: read the code, write PR comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    name: Claude Code Security Review
    # Dependabot and fork PRs have no repository secrets. Their ordinary tests,
    # Bandit and CodeQL still run; the API-backed reviewer needs a trusted event.
    if: >-
      vars.ENABLE_CLAUDE_SECURITY_REVIEW == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Check out the PR head and enough history for the action to diff the
          # change against its base.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Run Claude Code Security Review
        # No release tags are published. Keep a reviewed commit; Dependabot cannot
        # update this pin until upstream publishes version tags.
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
