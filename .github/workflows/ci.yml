name: Code Quality & Automated Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Lint, Syntax & Code Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt
      
      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall .
      
      - name: Run Ruff Linter
        run: |
          ruff check . --output-format=github --config ruff.toml
        continue-on-error: true
      
      - name: Run Ruff Formatter Check
        run: |
          ruff format --check . --config ruff.toml
        continue-on-error: true

  test-migrations:
    name: Database Migrations Test (Alembic & SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: |
          mkdir -p data /tmp/pg-limiter/data

      - name: Test Fresh SQLite Database Creation
        run: |
          python -c "
          import asyncio
          from db.models import Base
          from sqlalchemy.ext.asyncio import create_async_engine
          async def test_init():
              engine = create_async_engine('sqlite+aiosqlite:///./data/test_ci.db')
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()
              print('Fresh DB models created successfully!')
          asyncio.run(test_init())
          "

      - name: Test Alembic Migrations Upgrade (head)
        run: |
          python -m alembic upgrade head
          echo "Alembic migrations applied cleanly to head!"

  tests:
    name: Unit & Async Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt
      
      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/core_test.py \
            --ignore=tests/test_new_api.py \
            --ignore=tests/test_sse_logs.py \
            --ignore=tests/test_minimal.py
        env:
          PYTHONPATH: ${{ github.workspace }}

  security-scan:
    name: Security Vulnerability Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit Security Scan
        run: |
          bandit -r . \
            -x ./tests,./node_modules,./.git \
            -ll \
            --format txt
        continue-on-error: true
