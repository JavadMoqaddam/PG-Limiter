name: Code Quality & Automated Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Lint, Syntax & Code Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt
      
      - name: Python Syntax & Bytecode Compilation Check
        run: |
          python -m compileall .

      # compileall only proves each file parses. It says nothing about a name that
      # does not exist, which is what a large refactor actually breaks - a renamed
      # helper still parses fine at every call site. These four rule groups are the
      # ones that cannot be a matter of taste, so this step blocks instead of
      # warning. --select on the command line replaces ruff.toml's own select while
      # still honouring its exclude list.
      - name: Ruff - Release Blockers (undefined names, broken syntax)
        run: |
          ruff check . --config ruff.toml --select E9,F63,F7,F82 --output-format=github

      # Catches what neither compileall nor ruff does: a `from utils.x import y`
      # where y no longer exists. That parses fine and F821 does not see across
      # modules, so it only fails when the import is executed - which for a Telegram
      # handler means at bot startup. It found a real one: check_usage imported
      # `get_user` from utils.panel_api, which has only ever exported
      # `get_user_details`, so the panel fallback for unsynced users had never run.
      # Needs no third-party packages, so it also runs on a laptop with nothing
      # installed: `python3 tools/check_local_imports.py`.
      - name: Local import consistency
        run: |
          python tools/check_local_imports.py

      # Advisory on purpose: style and formatting findings should not stand between
      # a verified fix and production. The blocking checks are the step above, the
      # import sweep in the test job, and the migration job.
      - name: Run Ruff Linter
        run: |
          ruff check . --output-format=github --config ruff.toml
        continue-on-error: true

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check . --config ruff.toml
        continue-on-error: true

  test-migrations:
    name: Database Migrations Test (Alembic & SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directories
        run: |
          mkdir -p data /tmp/pg-limiter/data

      # Every step below names its own database through DATABASE_URL, which
      # db/migrations/env.py honours. The previous version of this job did not:
      # it built ./data/test_ci.db with create_all and then ran `alembic upgrade
      # head`, which fell back to alembic.ini's ./data/pg_limiter.db - a different,
      # empty file. So the two halves never met and no scenario here ever ran a
      # migration against a database that already had tables, which is the only
      # kind of database that exists in production.

      - name: Scenario 1 - migrations apply to an empty database and reach head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/fresh.db
        run: |
          python -m alembic upgrade head
          python -m alembic current 2>&1 | tee current.txt
          grep -q "(head)" current.txt

      - name: Scenario 2 - the migrated schema matches db/models.py
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/fresh.db
        run: |
          python tools/ci_migration_checks.py parity ./data/fresh.db
          python tools/ci_migration_checks.py assert-upsert ./data/fresh.db

      - name: Scenario 3 - a create_all database is stampable and reaches head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/legacy.db
        run: |
          python tools/ci_migration_checks.py create-all ./data/legacy.db
          python -m alembic stamp 006_drop_patterns
          python -m alembic upgrade head
          python tools/ci_migration_checks.py parity ./data/legacy.db
          python tools/ci_migration_checks.py assert-upsert ./data/legacy.db

      # The exact shape of every pre-Alembic installation, and the scenario the
      # first version of this job missed. The live database had ip_history without
      # UNIQUE(username, ip) - an old create_all built it before the model declared
      # the constraint - and no alembic_version at all. start.sh used to answer that
      # with `alembic stamp head`, which claims every revision is applied without
      # running one, so 007 never created the index and production failed once per
      # cycle with "ON CONFLICT clause does not match any PRIMARY KEY or UNIQUE
      # constraint". start.sh now stamps 006 and upgrades; this proves it.
      - name: Scenario 6 - a pre-Alembic database missing the unique index is repaired
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/prealembic.db
        run: |
          python tools/ci_migration_checks.py create-all ./data/prealembic.db
          python tools/ci_migration_checks.py drop-ip-history-unique ./data/prealembic.db
          python tools/ci_migration_checks.py unversion ./data/prealembic.db
          # Fails loudly if the upsert is broken before the repair, which is the
          # bug being reproduced.
          if python tools/ci_migration_checks.py assert-upsert ./data/prealembic.db; then
            echo "::error::the upsert should NOT work before the repair - this scenario is not reproducing the bug"
            exit 1
          fi
          python -m alembic stamp 006_drop_patterns
          python -m alembic upgrade head
          python tools/ci_migration_checks.py assert-upsert ./data/prealembic.db
          python tools/ci_migration_checks.py parity ./data/prealembic.db

      # The damage the released 1.4.0 actually did in the field: alembic_version
      # says 008 while the index 007 should have created is absent, so a plain
      # `upgrade head` is a no-op and the upsert stays broken forever. start.sh
      # detects this by inspecting the schema instead of trusting the recorded
      # version, then re-stamps 006 so the corrective revisions run again.
      - name: Scenario 7 - a database mis-stamped at head is repaired anyway
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/misstamped.db
        run: |
          python tools/ci_migration_checks.py create-all ./data/misstamped.db
          python tools/ci_migration_checks.py drop-ip-history-unique ./data/misstamped.db
          python -m alembic stamp head
          # Proves the trap: alembic reports head, and upgrading changes nothing.
          python -m alembic upgrade head
          if python tools/ci_migration_checks.py assert-upsert ./data/misstamped.db; then
            echo "::error::upgrade head should not have repaired this - scenario is not reproducing the bug"
            exit 1
          fi
          # The repair start.sh now performs.
          python -m alembic stamp 006_drop_patterns
          python -m alembic upgrade head
          python tools/ci_migration_checks.py assert-upsert ./data/misstamped.db
          python tools/ci_migration_checks.py parity ./data/misstamped.db

      - name: Scenario 4 - a populated 001..006 database survives the upgrade
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/populated.db
        run: |
          python -m alembic upgrade 006_drop_patterns
          python tools/ci_migration_checks.py seed-ip-history ./data/populated.db
          python -m alembic upgrade head
          python tools/ci_migration_checks.py assert-dedup ./data/populated.db
          python tools/ci_migration_checks.py parity ./data/populated.db
          python tools/ci_migration_checks.py assert-upsert ./data/populated.db

      - name: Scenario 5 - the chain is linear and downgrades cleanly
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/fresh.db
        run: |
          python -m alembic heads 2>&1 | tee heads.txt
          test "$(grep -c '(head)' heads.txt)" -eq 1
          python -m alembic downgrade -1
          python -m alembic upgrade head

  tests:
    name: Unit & Async Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
      
      # Pinned to major ranges on purpose. pytest.ini relies on
      # asyncio_default_fixture_loop_scope (pytest-asyncio >= 0.24) and on
      # asyncio_mode = auto; an unpinned install can pick up a major release that
      # changes how async tests are collected, and the failure mode is silent -
      # every async test simply stops running and the job still reports success.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.0,<9" "pytest-asyncio>=0.24,<2" "pytest-cov>=5,<8"
          pip install -r requirements.txt

      # core_test.py does not match python_files = test_*.py, so pytest never
      # collected it in the first place; naming it here only made the list look
      # more thorough than it was. test_minimal.py exercises mock classes defined
      # inside itself and asserts nothing, so it cannot fail and cannot help.
      # test_new_api.py and test_sse_logs.py need real panel credentials and are
      # now marked `integration`, which conftest.py skips without --run-integration
      # - collected and honestly skipped rather than hidden.
      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/core_test.py \
            --ignore=tests/test_minimal.py
        env:
          PYTHONPATH: ${{ github.workspace }}

  security-scan:
    name: Security Vulnerability Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Bandit
        run: pip install bandit

      # Advisory, but no longer invisible: the findings go into the run's summary
      # page instead of scrolling past inside a step that is allowed to fail, which
      # is how an advisory scan turns into an ignored one. Left non-blocking because
      # a false positive here should not stand between a verified fix and a deploy.
      - name: Run Bandit Security Scan
        run: |
          set +e
          bandit -r . \
            -x ./tests,./node_modules,./.git \
            -ll \
            --format txt | tee bandit.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Bandit (advisory)"
            echo ""
            echo '```'
            tail -n 60 bandit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "bandit exit status: $status"
          exit 0
